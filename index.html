/* ---------- Méthode pas à pas ---------- */
const pN = x => Number(String(x).replace(/[\s  ]/g,'').replace(',','.'));
const nf4 = n => Number(n).toLocaleString('fr-FR', { maximumFractionDigits:4 });
const NUM = '(\\d[\\d\\s\\u202f\\u00a0]*(?:,\\d+)?)';
const placeParts = b => String(b).split('').reverse().map((d,i)=>+d*10**i).filter(Boolean).reverse();
const sgn = v => (v >= 0 ? '+ ' : '− ') + nf(Math.abs(v));
function stepsFor(q){ try { const S = stepsCore(q); return S && S.length ? S : [q.tip]; } catch(e){ return [q.tip]; } }
function pctSteps(p, B, r){
  const v10 = B/10, v1 = B/100;
  const k = {
    10:[`10 %, c’est diviser par 10 : ${nf(B)} ÷ 10 = ${nf(r)}`],
    50:[`50 %, c’est la moitié : ${nf(B)} ÷ 2 = ${nf(r)}`],
    25:[`25 %, c’est un quart, donc la moitié de la moitié.`, `${nf(B)} ÷ 2 = ${nf(B/2)}`, `${nf(B/2)} ÷ 2 = ${nf(r)}`],
    75:[`75 % = 50 % + 25 %.`, `50 % : ${nf(B)} ÷ 2 = ${nf(B/2)}`, `25 % : ${nf(B/2)} ÷ 2 = ${nf(B/4)}`, `${nf(B/2)} + ${nf(B/4)} = ${nf(r)}`],
    5:[`10 % de ${nf(B)} : ${nf(B)} ÷ 10 = ${nf(v10)}`, `5 %, c’est la moitié de 10 % : ${nf(v10)} ÷ 2 = ${nf(r)}`],
    15:[`10 % de ${nf(B)} : ${nf(B)} ÷ 10 = ${nf(v10)}`, `5 % = la moitié de 10 % : ${nf(v10)} ÷ 2 = ${nf(v10/2)}`, `15 % = 10 % + 5 % = ${nf(v10)} + ${nf(v10/2)} = ${nf(r)}`],
    45:[`45 % = 50 % − 5 %.`, `50 % : ${nf(B)} ÷ 2 = ${nf(B/2)}`, `5 % : la moitié de 10 % (${nf(v10)}) = ${nf(B/20)}`, `${nf(B/2)} − ${nf(B/20)} = ${nf(r)}`],
    35:[`35 % = 25 % + 10 %.`, `25 % : ${nf(B)} ÷ 4 = ${nf(B/4)}`, `10 % : ${nf(B)} ÷ 10 = ${nf(v10)}`, `${nf(B/4)} + ${nf(v10)} = ${nf(r)}`],
    65:[`65 % = 50 % + 15 %.`, `50 % : ${nf(B)} ÷ 2 = ${nf(B/2)}`, `15 % = 10 % + 5 % = ${nf(v10)} + ${nf(v10/2)} = ${nf(B*.15)}`, `${nf(B/2)} + ${nf(B*.15)} = ${nf(r)}`]
  }[p];
  if (k) return k;
  const pt = Math.floor(p/10), pu = p%10, S = [`10 % de ${nf(B)} = ${nf(v10)} et 1 % = ${nf(v1)}`];
  if (pt > 1) S.push(`${pt*10} % = ${pt} × ${nf(v10)} = ${nf(pt*v10)}`);
  if (pu) S.push(`${pu} % = ${pu} × ${nf(v1)} = ${nf(pu*v1)}`);
  if (pt && pu) S.push(`${p} % = ${nf(pt*v10)} + ${nf(pu*v1)} = ${nf(r)}`);
  return S;
}
function stepsCore(q){
  const t = q.q, c = q.cat; let m;
  if (c==='add' && (m = t.match(new RegExp('^'+NUM+' \\+ '+NUM+'$')))){
    const a = pN(m[1]), b = pN(m[2]), u = b%10, S = [];
    if (b < 100 && u >= 6){ const up = b+10-u;
      S.push(`On arrondit ${nf(b)} à ${nf(up)} : on ajoute ainsi ${10-u} de trop.`, `${nf(a)} + ${nf(up)} = ${nf(a+up)}`, `On retire les ${10-u} en trop : ${nf(a+up)} − ${10-u} = ${nf(a+b)}`); }
    else { const parts = placeParts(b); if (parts.length > 1) S.push(`On découpe ${nf(b)} en ${parts.map(nf).join(' + ')}, puis on ajoute morceau par morceau.`);
      let acc = a; parts.forEach(p => { S.push(`${nf(acc)} + ${nf(p)} = ${nf(acc+p)}`); acc += p; }); }
    S.push(`Vérification : ${nf(a+b)} − ${nf(b)} = ${nf(a)}`); return S;
  }
  if (c==='sub' && (m = t.match(new RegExp('^'+NUM+' − '+NUM+'$')))){
    const a = pN(m[1]), b = pN(m[2]), u = b%10, S = [];
    if (b < 100 && u >= 6){ const up = b+10-u;
      S.push(`On arrondit ${nf(b)} à ${nf(up)} : on retire ainsi ${10-u} de trop.`, `${nf(a)} − ${nf(up)} = ${nf(a-up)}`, `On rend les ${10-u} retirés en trop : ${nf(a-up)} + ${10-u} = ${nf(a-b)}`); }
    else { const parts = placeParts(b); if (parts.length > 1) S.push(`On découpe ${nf(b)} en ${parts.map(nf).join(' + ')}, puis on retire morceau par morceau.`);
      let acc = a; parts.forEach(p => { S.push(`${nf(acc)} − ${nf(p)} = ${nf(acc-p)}`); acc -= p; }); }
    S.push(`Vérification : ${nf(a-b)} + ${nf(b)} = ${nf(a)}`); return S;
  }
  if (c==='mul' && (m = t.match(new RegExp('^'+NUM+' × '+NUM+'$')))){
    let a = pN(m[1]), b = pN(m[2]); const r = a*b, S = [], SP = [5,9,11,15,25];
    if (SP.includes(a) && !SP.includes(b)) [a,b] = [b,a];
    if (b===5 && a > 10) S.push(`× 5, c’est × 10 puis ÷ 2.`, `${nf(a)} × 10 = ${nf(a*10)}`, `${nf(a*10)} ÷ 2 = ${nf(r)}`);
    else if (b===9 && a > 10) S.push(`× 9, c’est × 10 moins une fois le nombre.`, `${nf(a)} × 10 = ${nf(a*10)}`, `${nf(a*10)} − ${nf(a)} = ${nf(r)}`);
    else if (b===11){ S.push(`× 11, c’est × 10 plus une fois le nombre.`, `${nf(a)} × 10 = ${nf(a*10)}`, `${nf(a*10)} + ${nf(a)} = ${nf(r)}`);
      if (a >= 10 && a < 100){ const d1 = Math.floor(a/10), d2 = a%10, s2 = d1+d2;
        S.push(s2 < 10 ? `Raccourci : ${d1} + ${d2} = ${s2}, qu’on glisse entre ${d1} et ${d2} → ${nf(r)}` : `Raccourci : ${d1} + ${d2} = ${s2} ; on garde ${s2%10} au milieu et la retenue 1 s’ajoute au ${d1} → ${nf(r)}`); } }
    else if (b===25) S.push(`× 25, c’est × 100 puis ÷ 4, soit deux fois la moitié.`, `${nf(a)} × 100 = ${nf(a*100)}`, `${nf(a*100)} ÷ 2 = ${nf(a*50)}`, `${nf(a*50)} ÷ 2 = ${nf(r)}`);
    else if (b===15) S.push(`× 15, c’est × 10 plus la moitié de ce résultat.`, `${nf(a)} × 10 = ${nf(a*10)}`, `La moitié : ${nf(a*10)} ÷ 2 = ${nf(a*5)}`, `${nf(a*10)} + ${nf(a*5)} = ${nf(r)}`);
    else if (a <= 10 && b <= 10){ const big = Math.max(a,b), small = Math.min(a,b);
      S.push(`Point d’appui dans une table connue : ${big} × ${small-1} = ${big*(small-1)}`, `On ajoute ${big} une fois de plus : ${big*(small-1)} + ${big} = ${r}`); }
    else { if (a < b) [a,b] = [b,a];
      if (b < 10){ const at = a - a%10, au = a%10;
        S.push(`On découpe ${a} en ${at} + ${au}.`, `${at} × ${b} = ${nf(at*b)}`); if (au) S.push(`${au} × ${b} = ${au*b}`, `${nf(at*b)} + ${au*b} = ${nf(r)}`); }
      else { const bt = b - b%10, bu = b%10;
        S.push(`On découpe ${b} en ${bt}${bu ? ' + '+bu : ''} : ${a} × ${b} = ${a} × ${bt}${bu ? ' + '+a+' × '+bu : ''}.`, `${a} × ${bt} = ${a} × ${bt/10} × 10 = ${nf(a*bt/10)} × 10 = ${nf(a*bt)}`);
        if (bu) S.push(`${a} × ${bu} = ${nf(a*bu)}`, `${nf(a*bt)} + ${nf(a*bu)} = ${nf(r)}`); } }
    S.push(`Vérification : ${nf(r)} ÷ ${nf(b)} = ${nf(a)}`); return S;
  }
  if (c==='div' && (m = t.match(new RegExp('^'+NUM+' ÷ '+NUM+'$')))){

const upcomingExams = () => { ensurePartiels(); const tk = todayKey(); return state.partiels.filter(e=>e.date >= tk).sort((a,b)=>a.date.localeCompare(b.date)); };
const nextExamOf = deckId => upcomingExams().find(e => e.deck===deckId) || null;
function linkCardsToExams(cards, exId){
  // exId : examen choisi à l'import ; sinon, les examens à venir liés aux matières des cartes
  const tk = todayKey(), out = [];
  if (!cards.length) return out;
  if (exId){ const ex = state.partiels.find(x=>x.id===exId); if (ex && !ex.deck){ const cnt = {}; cards.forEach(c=>cnt[c.deck]=(cnt[c.deck]||0)+1); ex.deck = Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0]; } }
  upcomingExams().filter(ex => ex.date > tk && (ex.id===exId || (ex.deck && cards.some(c=>c.deck===ex.deck)))).forEach(ex => {
    const mine = ex.id===exId ? cards : cards.filter(c=>c.deck===ex.deck);
    const ch = [...new Set(mine.map(c=>c.chap).filter(Boolean))].filter(c=>!ex.chapters.includes(c));
    if (ch.length){ ex.chapters.push(...ch); planPartiel(ex); }
    if (ch.length || ex.id===exId) out.push({ ex, n:ch.length });
  });
  return out;
}

}

  'Qu’est-ce que la déflation ?': 'Une baisse générale et durable des prix. Elle pousse à reporter les achats et alourdit les dettes ; à ne pas confondre avec la désinflation, qui est un simple ralentissement.',

  'Qui fixe les taux directeurs ?': 'La banque centrale : la BCE pour la zone euro, la Fed aux États-Unis. Les banques commerciales répercutent ensuite ces taux sur leurs crédits.',
  'À quoi sert d’abord une hausse des taux directeurs ?': 'Le crédit coûte plus cher, la demande ralentit, et l’inflation baisse. À l’inverse, une baisse des taux sert à relancer l’activité.',

  'Taux de TVA sur la restauration sur place ?': '10 %, comme les transports de voyageurs et les travaux de rénovation courants. Les boissons alcoolisées restent à 20 %.',
  'Taux de TVA sur les médicaments remboursables ?': '2,1 % (taux super-réduit), aussi pour la presse. Les médicaments non remboursables sont à 10 %.',

  'Compte du PCG des clients ?': '411 Clients, au débit lors de la facturation et au crédit à l’encaissement. 401 : fournisseurs ; 445 : État, TVA.',

function packWhy(c){
  if (c.map && MAPC[c.map]){ const x = MAPC[c.map], near = MAPG[c.map] ? nearOf(c.map, 3, o => o.r===x.r).map(o=>o.n) : [];

  if (ECO_WHY[c.q]) return ECO_WHY[c.q];
  const capM = c.q.match(/^Quelle est la capitale (.+) \?$/), curM = c.q.match(/^Quelle est la monnaie (.+) \?$/);

  const same = Object.values(MAPC).filter(o => o.id!==x.id && o.cur===x.cur).map(o=>o.n), fam = x.cur.split(' ')[0];
  const sib = [...new Set(Object.values(MAPC).map(o=>o.cur).filter(c => c!==x.cur && c.split(' ')[0]===fam))];
  return `${Art(x)} (${REGN[x.r]}${x.cap ? ', capitale ' + x.cap : ''}) a pour monnaie : ${x.cur}${CUR_ISO[x.cur] ? ' (code ' + CUR_ISO[x.cur] + ')' : ''}${same.length ? ', comme ' + same.join(', ') : ''}.${sib.length ? ` Attention : « ${fam} » désigne plusieurs monnaies différentes (${sib.slice(0,3).join(', ')}…).` : ''}${x.id==='208' || x.id==='752' || x.id==='616' || x.id==='203' || x.id==='348' || x.id==='642' ? ' Le pays est dans l’UE mais n’a pas adopté l’euro.' : ''}${x.cur==='franc CFA' ? ' Le franc CFA a une parité fixe avec l’euro (1 € = 655,957 F CFA).' : ''}`;

function optNote(c, opt){

  const byCap = Object.values(MAPC).find(x => x.cap===o), byCur = Object.values(MAPC).filter(x => x.cur===o), byName = Object.values(MAPC).find(x => x.n===o);
  if (/capitale/.test(c.q) && byCap) return `${o} est la capitale ${article(byCap)}.`;
  if (/capitale/.test(c.q)){ const tw = Object.entries(CAP_TRAPS).find(([,l]) => l.includes(o)); if (tw) return `${o} est une ville ${article(MAPC[tw[0]])}, mais pas sa capitale.`; }

/* ---------- Notions : lien entre un examen et les cartes ---------- */
const normN = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[’'`]/g,' ').replace(/[^a-z0-9%]+/g,' ').trim();
const STOPN = new Set('le la les de des du un une et en au aux sur pour par dans avec chapitre chap partie cours theme notion'.split(' '));
const wordsN = s => normN(s).split(' ').filter(w => w.length > 1 && !STOPN.has(w));
const wEq = (w, x) => w===x || (w.length >= 5 && x.length >= 5 && w.slice(0,5)===x.slice(0,5));
function notionMatch(key, label){
  const a = normN(key), b = normN(label); if (!a || !b) return false;
  if (a===b || (a.length >= 4 && b.includes(a)) || (b.length >= 4 && a.includes(b))) return true;
  const wa = wordsN(key), wb = wordsN(label); return wa.length > 0 && wa.every(w => wb.some(x => wEq(w, x)));
}
const cardLabels = c => [c.chap, ...(c.tags||[])].filter(Boolean);
const textHas = (c, key) => { const wa = wordsN(key); if (!wa.length) return false; const tw = wordsN(c.q + ' ' + c.a); return wa.every(w => tw.some(x => wEq(w, x))); };
function examCardSets(ex){
  ensureFc(); const keys = (ex.chapters||[]).filter(Boolean), plus = new Set(ex.plus||[]), minus = new Set(ex.minus||[]);
  const all = state.fc.cards;
  const auto = all.filter(c => keys.length ? keys.some(k => cardLabels(c).some(l => notionMatch(k, l))) : (ex.deck && c.deck===ex.deck));
  const autoS = new Set(auto.map(c=>c.id));
  const sugg = keys.length ? all.filter(c => !autoS.has(c.id) && keys.some(k => textHas(c, k))) : [];
  const linked = all.filter(c => (autoS.has(c.id) || plus.has(c.id)) && !minus.has(c.id));
  return { linked, auto, sugg, plus, minus };
}
function notionCards(ex, key){
  const { linked } = examCardSets(ex);
  return key ? linked.filter(c => cardLabels(c).some(l => notionMatch(key, l)) || textHas(c, key)) : linked;
}
function reviewCardsList(list, label){
  if (!list.length) return toast('Aucune carte liée pour l’instant');
  const tk = todayKey(), due = list.filter(c => !c.seen || c.due <= tk), rest = list.filter(c => c.seen && c.due > tk);
  const ord = [...due.map(c=>({c,r:Math.random()})).sort((a,b)=>a.r-b.r), ...rest.map(c=>({c,r:Math.random()})).sort((a,b)=>a.r-b.r)].map(x=>x.c);
  ui.tab = 'cartes'; ui.fc.exam = null; startReviewList(ord, null); ui.fc.label = label; ui.fc.practice = new Set(rest.map(c=>c.id)); render();
}
function partielTest(id){

  ui.tab = 'cartes'; startExamFromList(examCardSets(ex).linked, { deck:null, chap:'exam:'+ex.id, label:ex.title, exId:ex.id });

function examCardsSheet(ex){
  const S = examCardSets(ex), plus = new Set(S.plus), minus = new Set(S.minus);
  const row = (c, on) => { const d = deckOf(c.deck); return `<button type="button" class="packi xc" data-xc="${c.id}" aria-pressed="${on}"><i></i><span><b>${fmtText(c.q.length > 90 ? c.q.slice(0,90)+'…' : c.q)}</b><small>${esc(d ? d.name : '')}${c.chap ? ' · ' + esc(c.chap) : ''}${(c.tags||[]).length ? ' · ' + esc(c.tags.join(', ')) : ''}</small></span></button>`; };
  const autoL = S.auto.slice(0, 200), suggL = [...S.sugg, ...state.fc.cards.filter(c => plus.has(c.id) && !S.auto.includes(c) && !S.sugg.includes(c))].slice(0, 150);

    <span class="lab">Liées par le chapitre ou les notions (${S.auto.length})</span>
    <div class="packl">${autoL.map(c => row(c, !minus.has(c.id))).join('') || '<p class="fine">Aucune carte n’a ce chapitre ou ces notions.</p>'}</div>
    ${suggL.length ? `<span class="lab">Suggestions : le mot apparaît dans la carte (${suggL.length})</span><div class="packl">${suggL.map(c => row(c, plus.has(c.id))).join('')}</div>` : ''}
    <p class="fine" id="xc-n"></p>
    <div class="btns"><button class="btn" data-close>Annuler</button><button class="btn primary" id="xc-save">Enregistrer</button></div>`, s => {
    const autoS = new Set(S.auto.map(c=>c.id));
    const cnt = () => { const n = state.fc.cards.filter(c => (autoS.has(c.id) || plus.has(c.id)) && !minus.has(c.id)).length; s.querySelector('#xc-n').textContent = `${n} carte${n>1?'s':''} retenue${n>1?'s':''} pour cet examen.`; };
    s.addEventListener('click', e => { const b = e.target.closest('[data-xc]'); if (!b) return; const id = b.dataset.xc, on = b.getAttribute('aria-pressed')!=='true';
      b.setAttribute('aria-pressed', on);
      if (autoS.has(id)){ on ? minus.delete(id) : minus.add(id); } else { on ? plus.add(id) : plus.delete(id); }
      cnt(); });
    cnt();
    s.querySelector('#xc-save').addEventListener('click', () => { ex.plus = [...plus]; ex.minus = [...minus]; close(); commit(); toast('Cartes de l’examen enregistrées'); });
  });

    <div class="btns"><button class="btn danger" id="s-wipe">Tout effacer</button><button class="btn" data-close>Fermer</button></div>`, s => {
    fillSnaps(s.querySelector('#s-snaps'));
    const msg = s.querySelector('#s-msg'), inp = s.querySelector('#s-in'), out = s.querySelector('#s-out');
    const nm = s.querySelector('#s-name'); nm.addEventListener('change', () => { state.profile = { ...(state.profile||{}), name: nm.value.trim().slice(0,30) }; commit(); toast('Prénom enregistré'); });
    let data = '';
    exportData().then(d => { data = JSON.stringify(d); out.value = data; }).catch(() => { data = JSON.stringify({ app:'tempo', tasks:state.tasks, goals:state.goals }); out.value = data; });
    const mark = () => { ensureMeta(); state.meta.lastBackup = todayKey(); save(); };
    s.querySelector('#s-copy').addEventListener('click', () => {
      const done = () => { mark(); msg.textContent = 'Copié. Colle-le sur ton autre appareil.'; };
      const fallback = () => { out.select(); mark(); msg.textContent = 'Texte sélectionné : utilise Copier de ton appareil.'; };
      try { navigator.clipboard.writeText(out.value).then(done, fallback); } catch(_) { fallback(); }
    });
    const dl = s.querySelector('#s-dl');
    dl && dl.addEventListener('click', () => { if (!data) return; const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type:'application/json' })); a.download = `tempo-sauvegarde-${todayKey()}.json`; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); mark(); msg.textContent = 'Fichier téléchargé.'; });
    s.querySelector('#s-file').addEventListener('change', e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { inp.value = r.result; msg.textContent = 'Fichier chargé. Choisis « Ajouter » ou « Remplacer ».'; }; r.readAsText(f); });
    const doImport = replace => {
      let d; try { d = JSON.parse(inp.value); } catch(_) { msg.textContent = 'Ces données ne sont pas lisibles. Vérifie que tout le texte a été collé.'; return; }
      if (!d || !Array.isArray(d.tasks)) { msg.textContent = 'Fichier non reconnu : il doit venir de l’export Tempo.'; return; }
      const goals = Array.isArray(d.goals) ? d.goals : [];
      const dc = d.calc && Array.isArray(d.calc.history) ? d.calc : null;
      const ds = d.sudoku && d.sudoku.stats ? d.sudoku : null;
      const df = d.fc && Array.isArray(d.fc.cards) ? d.fc : null;
      const dr = Array.isArray(d.routines) ? d.routines : null;
      const dfo = d.focus && Array.isArray(d.focus.sessions) ? d.focus : null;
      Object.entries(d.images || {}).forEach(([id,v]) => IMG.put(id, v).catch(()=>{}));
      if (replace){
        SNAP.before('Avant import');
        state.tasks = d.tasks; state.goals = goals; if (dc) state.calc = dc; if (ds) state.sudoku = ds; if (df) state.fc = df;
        if (dr) state.routines = dr; if (dfo) state.focus = { ...dfo, run:null }; if (Array.isArray(d.partiels)) state.partiels = d.partiels; ['journal','stats','badges','badgeBest'].forEach(k => { if (d[k]) state[k] = d[k]; }); if (d.mit) state.mit = d.mit;
      } else {
        const ids = new Set(state.tasks.map(t=>t.id)), gids = new Set(state.goals.map(g=>g.id));
        ensureExtras(); Object.entries(d.journal||{}).forEach(([k,v]) => { if (!state.journal[k]) state.journal[k] = v; });
        Object.entries(d.stats||{}).forEach(([k,v]) => { state.stats[k] = Math.max(state.stats[k]||0, v||0); });
        Object.entries(d.badgeBest||{}).forEach(([k,v]) => { state.badgeBest[k] = Math.max(state.badgeBest[k]||0, v||0); });
        Object.entries(d.badges||{}).forEach(([k,v]) => { if (!state.badges[k] || state.badges[k].l < v.l) state.badges[k] = v; });
        if (Array.isArray(d.partiels)){ ensurePartiels(); const pid = new Set(state.partiels.map(x=>x.id)); state.partiels.push(...d.partiels.filter(x=>!pid.has(x.id))); }
        state.tasks.push(...d.tasks.filter(t=>!ids.has(t.id))); state.goals.push(...goals.filter(g=>!gids.has(g.id)));
        if (dc){ ensureCalc(); const seen = new Set(state.calc.history.map(h=>h.d+h.ms+h.ok));
          state.calc.history = [...state.calc.history, ...dc.history.filter(h=>!seen.has(h.d+h.ms+h.ok))].slice(-60);
          Object.entries(dc.daily||{}).forEach(([k,v]) => { const p = state.calc.daily[k]; if (!p || v.ok > p.ok) state.calc.daily[k] = v; }); }
        if (ds){ ensureSudoku(); const S = state.sudoku;
          Object.entries(ds.daily||{}).forEach(([k,v]) => { if (!S.daily[k] || v.ms < S.daily[k].ms) S.daily[k] = v; });
          [1,2,3].forEach(l => { S.stats.solved[l] = Math.max(S.stats.solved[l]||0, ds.stats.solved[l]||0); const b = ds.stats.best[l]; if (b && (!S.stats.best[l] || b < S.stats.best[l])) S.stats.best[l] = b; });
          S.log = S.log || {}; Object.entries(ds.log||{}).forEach(([k,v]) => { S.log[k] = Math.max(S.log[k]||0, v); });
          if (!S.game && ds.game) S.game = ds.game; }
        if (df){ const F = state.fc, map = {};
          (df.decks||[]).forEach(x => { const m = F.decks.find(y=>y.id===x.id) || F.decks.find(y=>y.name.toLowerCase()===x.name.toLowerCase()); if (m) map[x.id] = m.id; else { F.decks.push(x); map[x.id] = x.id; } });
          df.cards.forEach(c => { const ex = F.cards.find(y=>y.id===c.id); if (!ex) F.cards.push({ ...c, deck: map[c.deck]||c.deck }); else if ((c.reps||0) > (ex.reps||0)) Object.assign(ex, c, { deck: map[c.deck]||c.deck }); });
          Object.entries(df.log||{}).forEach(([k,v]) => { F.log[k] = Math.max(F.log[k]||0, v); });
          const ek = new Set((F.exams||[]).map(e=>e.deck+e.chap+e.d+e.note)); F.exams = [...(F.exams||[]), ...(df.exams||[]).map(e=>({ ...e, deck: map[e.deck]||e.deck })).filter(e=>!ek.has(e.deck+e.chap+e.d+e.note))]; }
        if (dr){ ensureRoutines(); const rid = new Set(state.routines.map(r=>r.id)); state.routines.push(...dr.filter(r=>!rid.has(r.id))); }
        if (dfo){ ensureFocus(); const sid = new Set(state.focus.sessions.map(x=>x.id)); state.focus.sessions.push(...dfo.sessions.filter(x=>!sid.has(x.id))); }
      }
      state.examples = state.tasks.some(t=>t.ex) || state.goals.some(g=>g.ex);
      mark(); close(); commit(); drawFocus(); toast(`${d.tasks.length} tâches importées`);
    };
    s.querySelector('#s-merge').addEventListener('click', () => doImport(false));
    const rep = s.querySelector('#s-replace');
    rep.addEventListener('click', () => { if (rep.dataset.armed) doImport(true); else { rep.dataset.armed='1'; rep.textContent='Confirmer le remplacement'; } });
    const wipe = s.querySelector('#s-wipe');
    wipe.addEventListener('click', () => { if (wipe.dataset.armed){
        SNAP.before('Avant effacement');
        state = { v:1, examples:false, tasks:[], goals:[], routines:[], partiels:[], journal:{}, stats:{}, badges:{}, badgeBest:{}, meta:{ created:todayKey(), lastBackup:null }, fc:{ decks:[], cards:[], newDay:{ d:'', n:0 }, log:{}, exams:[], prefs:{ mode:'flip' } } };
        close(); commit(); drawFocus(); toast('Données effacées'); }
      else { wipe.dataset.armed='1'; wipe.textContent='Confirmer l’effacement'; } });
  });
}

ensureExtras(); checkBadges(true); badgesReady = true; save();
render();
drawFocus();
SNAP.now();
if (!state.profile) setTimeout(welcomeSheet, 450);
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  const hadController = !!navigator.serviceWorker.controller; let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !reloaded) { reloaded = true; location.reload(); } });
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
    reg.update().catch(() => {});
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
  }).catch(() => {}));
}
</script>
