<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Tempo</title>
<meta name="description" content="Agenda, révisions, calcul mental, sudoku et flashcards">
<meta name="theme-color" content="#EEF2EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1513" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tempo">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout : appli mobile une colonne, en-tête collant, barre d'onglets fixée en bas */
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --surface-2:#E3EAE5; --fg:#16201C; --muted:#5B6A63; --line:#D3DDD7;
  --accent:#1E5B4F; --accent-ink:#FFFFFF; --accent-soft:#D5E7E0;
  --amber:#C26B17; --amber-soft:#F6E3CF; --danger:#B3362E; --danger-soft:#F6D9D6; --ok:#2E7D4F;
  --c-cours:#3B5BA9; --c-alt:#8A4FB0; --c-perso:#C26B17;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:16px; --shadow:0 1px 2px rgb(30 35 40 / .05), 0 6px 18px rgb(30 35 40 / .06);
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1513; --surface:#18201D; --surface-2:#222C28; --fg:#E6EDE9; --muted:#93A39C; --line:#2C3833;
  --accent:#62C3A9; --accent-ink:#0B1311; --accent-soft:#1E3A33;
  --amber:#E9A35A; --amber-soft:#3A2A1A; --danger:#EF7A70; --danger-soft:#3D1F1C; --ok:#6CCB92;
  --c-cours:#88A6EE; --c-alt:#C49AE6; --c-perso:#E9A35A; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1513; --surface:#18201D; --surface-2:#222C28; --fg:#E6EDE9; --muted:#93A39C; --line:#2C3833;
  --accent:#62C3A9; --accent-ink:#0B1311; --accent-soft:#1E3A33;
  --amber:#E9A35A; --amber-soft:#3A2A1A; --danger:#EF7A70; --danger-soft:#3D1F1C; --ok:#6CCB92;
  --c-cours:#88A6EE; --c-alt:#C49AE6; --c-perso:#E9A35A; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb, var(--bg) 86%, transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  padding-block:14px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.brand h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
.hbtns{display:flex;gap:8px}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;box-shadow:var(--shadow)}
.icon-btn svg{width:20px;height:20px}

main{padding-bottom:76px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
section h2{font-family:var(--f-display);font-weight:700;font-size:17px;margin:0 0 8px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
section h2 .link{font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--accent);background:none;border:0;padding:0}
.card{background:var(--surface);border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--shadow)}

/* Accueil */
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;padding:18px 16px;background:linear-gradient(135deg, var(--accent-soft), var(--surface) 72%)}
.ring{width:92px;height:92px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.05}
.ring .lbl b{font-family:var(--f-mono);font-size:22px}
.ring .lbl span{font-size:11px;color:var(--muted)}
.hero p{margin:0;color:var(--muted)}
.hero strong{display:block;font-family:var(--f-display);font-size:19px;color:var(--fg);margin-bottom:2px}
.soon{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.soon .tile{padding:12px;border-radius:var(--r);background:var(--surface-2);display:flex;flex-direction:column;gap:6px;min-width:0}
.soon .tile b{font-size:14px}
.soon .tile span{font-size:12px;color:var(--muted)}
.soon .tile svg{width:22px;height:22px;color:var(--accent)}
@media (max-width:380px){.soon{grid-template-columns:1fr}}

/* Banner */
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:12px;background:var(--amber-soft);color:var(--fg);font-size:13px}
.banner button{border:0;background:none;color:var(--amber);font-weight:700;white-space:nowrap}

/* Segments */
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;padding:8px 6px;border-radius:9px;font-weight:600;color:var(--muted);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .08)}

.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daynav .t{text-align:center;min-width:0}
.daynav .t b{display:block;font-family:var(--f-display);font-size:18px;text-transform:capitalize}
.daynav .t span{font-size:12px;color:var(--muted)}
.daynav .t button{border:0;background:none;padding:0;font:inherit;color:inherit}

/* Tâches */
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.check{width:24px;height:24px;border-radius:8px;border:2px solid var(--muted);background:none;display:grid;place-items:center;padding:0}
.check svg{width:14px;height:14px;opacity:0}
.task.done .check{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.task.done .check svg{opacity:1}
.task .body{min-width:0}
.task .title{font-weight:600;overflow-wrap:anywhere}
.task.done .title{color:var(--muted);font-weight:500}
.task .title span{box-decoration-break:clone;-webkit-box-decoration-break:clone;background:linear-gradient(var(--muted),var(--muted)) 0 58%/0 1.5px no-repeat}
.task.done .title span{background-size:100% 1.5px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px;font-size:12px;color:var(--muted);align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-weight:600}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.cours{color:var(--c-cours)} .chip.alternance{color:var(--c-alt)} .chip.perso{color:var(--c-perso)}
.prio{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--amber);background:var(--amber-soft);padding:1px 7px;border-radius:99px}
.more{border:0;background:none;width:32px;height:32px;border-radius:8px;color:var(--muted);display:grid;place-items:center}
.more svg{width:18px;height:18px}
.actions{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:8px;padding-left:36px}
.actions button{border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600}
.actions button.del{color:var(--danger)}
.empty{padding:22px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-family:var(--f-display);font-size:16px;margin-bottom:2px}

/* Semaine */
.week{display:flex;flex-direction:column;gap:10px}
.wday{padding:10px 14px}
.wday.today{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent), var(--shadow)}
.wday .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;border:0;background:none;padding:0;text-align:left}
.wday .hd b{font-family:var(--f-display);font-size:15px;text-transform:capitalize}
.wday .hd span{font-size:12px;color:var(--muted)}
.wday ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.wday li{display:flex;gap:8px;align-items:center;font-size:14px;min-width:0}
.wday li .dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.wday li.done{color:var(--muted);text-decoration:line-through}
.wday li.done .dot{background:var(--accent)}
.wday li span{overflow-wrap:anywhere;min-width:0}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .3s}

/* Objectifs */
.goals{display:flex;flex-direction:column;gap:10px}
.goal{padding:14px;display:flex;flex-direction:column;gap:10px}
.goal .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.goal .gt{font-weight:700;font-size:16px;overflow-wrap:anywhere;min-width:0}
.goal .per{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:2px 8px;white-space:nowrap}
.goal .ctl{display:flex;align-items:center;justify-content:space-between;gap:10px}
.goal .num{font-family:var(--f-mono);font-size:14px;color:var(--muted)}
.goal .num b{color:var(--fg);font-size:18px}
.step{display:flex;gap:6px}
.step button{width:38px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-weight:700;font-size:18px;line-height:1}
.goal.complete .bar i{background:var(--ok)}
.goal .done-tag{color:var(--ok);font-weight:700;font-size:13px}

/* FAB */
.fab{position:fixed;right:max(16px,calc((100vw - 560px) / 2 + 16px));right:max(16px, env(safe-area-inset-right,0px), calc((100vw - 560px)/2 + 16px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:6;
  height:52px;padding:0 20px 0 16px;border-radius:16px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgb(0 0 0 / .18)}
.fab svg{width:20px;height:20px}

/* Barre d'onglets */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:color-mix(in srgb, var(--surface) 84%, transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs button{border:0;background:none;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs button[aria-current="page"] .pill{background:var(--accent-soft)}
nav.tabs .pill{padding:3px 14px;border-radius:99px;display:grid;place-items:center}

/* Feuille modale */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;max-height:88vh;overflow:auto;
  padding-block:18px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.sheet h3{margin:0;font-family:var(--f-display);font-size:20px}
.sheet p{margin:0;color:var(--muted);font-size:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lab{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;width:100%;min-width:0}
.field textarea{font-family:var(--f-mono);font-size:12px;min-height:120px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:7px 13px;font-size:14px;font-weight:600}
.opts button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 16px;font-weight:700;flex:1}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100vw - 32px)}
hr.sep{border:0;border-top:1px solid var(--line);margin:4px 0}

/* À venir */
.future{padding:22px 18px;display:flex;flex-direction:column;gap:12px}
.future .tag{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--accent-soft);color:var(--accent);padding:3px 9px;border-radius:99px}
.future h3{margin:0;font-family:var(--f-display);font-size:22px;text-wrap:balance}
.future ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;color:var(--muted)}
.future ul b{color:var(--fg);font-weight:600}
.preview-grid{display:grid;grid-template-columns:repeat(9,1fr);border:2px solid var(--fg);border-radius:8px;overflow:hidden;max-width:300px;aspect-ratio:1;width:100%}
.preview-grid div{display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.preview-grid div:nth-child(9n+3),.preview-grid div:nth-child(9n+6){border-right:2px solid var(--fg)}
.preview-grid div:nth-child(n+19):nth-child(-n+27),.preview-grid div:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid var(--fg)}
.preview-calc{font-family:var(--f-mono);font-size:30px;font-weight:700;padding:18px;text-align:center;background:var(--surface-2);border-radius:12px}
.preview-calc span{color:var(--accent)}
.flash{background:var(--surface-2);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px}
.flash small{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--c-cours)}
.flash b{font-family:var(--f-display);font-size:17px}

/* Calcul mental */
.card.pad{padding:16px;display:flex;flex-direction:column;gap:14px}
.daily{padding:16px;display:flex;flex-direction:column;gap:14px;background:linear-gradient(150deg, var(--accent-soft) 10%, var(--surface) 95%);border-color:transparent}
.daily .drow{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.daily h3{margin:2px 0 4px;font-family:var(--f-display);font-size:22px;line-height:1.15}
.daily p{margin:0;color:var(--muted);font-size:14px}
.streak{display:flex;flex-direction:column;align-items:center;flex:none;background:var(--surface);border-radius:12px;padding:8px 12px;min-width:76px}
.streak b{font-size:24px;color:var(--accent);line-height:1.1}
.streak span{font-size:11px;color:var(--muted);text-align:center}
.opts.checks button{display:inline-flex;align-items:center;gap:6px}
.opts.checks button svg{width:13px;height:13px}
.seg:has(button:nth-child(2):last-child){grid-template-columns:repeat(2,1fr)}
.seg.mini{display:inline-grid;grid-template-columns:repeat(2,auto);padding:3px;font-family:var(--f-body)}
.seg.mini button{padding:4px 10px;font-size:13px}
.playhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px}
.playhead>*{white-space:nowrap}
.playhead .lab{overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1;text-align:center}
.qcard{padding:18px 16px;display:flex;flex-direction:column;gap:6px;transition:border-color .25s, box-shadow .25s}
.qcard.good{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok)}
.qcard.badf{border-color:var(--danger);box-shadow:0 0 0 2px var(--danger)}
.calc-q{font-size:clamp(30px,10vw,48px);font-weight:700;text-align:center;padding:22px 4px 26px;line-height:1.15;overflow-wrap:anywhere;letter-spacing:-.02em}
.ans{display:flex;gap:10px}
.ans input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;font-size:22px;text-align:center}
.ans .btn{flex:none}
.weak{margin:0;font-size:14px;background:var(--amber-soft);border-radius:10px;padding:8px 12px}
.srows{display:flex;flex-direction:column;gap:9px}
.srow{display:grid;grid-template-columns:minmax(0,9.5em) 1fr 3.4em;gap:10px;align-items:center;font-size:14px}
.srow b{text-align:right;font-size:13px}
.bar.mid i{background:var(--amber)} .bar.low i{background:var(--danger)}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.hist li{display:flex;justify-content:space-between;gap:10px}
.hist li span{color:var(--muted);min-width:0}
.hist li b{font-size:13px;white-space:nowrap}
.corr{list-style:none;margin:0;padding:0}
.corr li{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.corr li:first-child{border-top:0}
.corr .mark{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;margin-top:1px}
.corr .mark svg{width:13px;height:13px}
.corr li.ok .mark{background:var(--accent-soft);color:var(--ok)}
.corr li.bad .mark{background:var(--danger);color:var(--surface)}
.corr .cq{font-size:16px;overflow-wrap:anywhere}
.corr .wrong{color:var(--danger);text-decoration:line-through}
.corr .tip{margin-top:6px;font-size:13px;background:var(--surface-2);border-radius:8px;padding:6px 10px;overflow-wrap:anywhere}
.corr .tip b{color:var(--accent);margin-right:4px}
.corr li.ok .tip{opacity:.8}
.corr li.ok .msteps[open]{opacity:1}

/* Sudoku */
.back{border:0;background:none;display:inline-flex;align-items:center;gap:2px;font-weight:700;color:var(--accent);padding:4px 6px 4px 0}
.back svg{width:18px;height:18px}
.sdaily{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sdaily button{padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.sdaily b{font-family:var(--f-display);font-size:16px}

.pplan li button{width:100%;border:0;border-top:1px solid var(--line);background:none;display:grid;grid-template-columns:auto auto 1fr;gap:10px;align-items:center;padding:8px 2px;text-align:left;font-size:14px}
.pplan li:first-child button{border-top:0}
.pplan li i{width:20px;height:20px;border-radius:6px;border:2px solid var(--muted);display:grid;place-items:center}
.pplan li i svg{width:11px;height:11px}
.pplan li.done i{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pplan li.done .pt{color:var(--muted);text-decoration:line-through}
.pplan li.late .pd{color:var(--danger);font-weight:700}
.pplan .pd{font-size:12px;color:var(--muted);min-width:56px;text-transform:capitalize}
.pplan .pt{min-width:0;overflow-wrap:anywhere}
.pcard.past{opacity:.75}
.pastx summary{cursor:pointer;font-weight:700;color:var(--muted);padding:4px 0 10px}
.ppreview{margin:0;font-size:14px;font-weight:600;background:var(--accent-soft);border-radius:10px;padding:10px 12px}
.excd{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);--uc:var(--accent)}
.excd.warm{--uc:var(--amber)} .excd.hot{--uc:var(--danger)}
.excd .jx{min-width:62px;height:52px;border-radius:14px;display:grid;place-items:center;padding:0 8px;background:color-mix(in srgb, var(--uc) 14%, var(--surface));color:var(--uc)}
.excd .jx b{font-size:18px}
.excd .ext{display:flex;flex-direction:column;gap:3px;min-width:0}
.excd .ext b{font-family:var(--f-display);font-size:16px;overflow-wrap:anywhere}
.excd .ext>span:not(.bar){font-size:12px;color:var(--muted)}
.excd .ext em{font-style:normal;color:var(--danger);font-weight:700}
.excd .bar{height:5px;margin-top:3px} .excd .bar i{background:var(--uc)}
.hot .jx,.hot .pcd{animation:glowr 2.4s ease-in-out 1s 2}
@keyframes glowr{50%{box-shadow:0 0 0 5px color-mix(in srgb, var(--danger) 18%, transparent)}}

/* v3 : larges boutons d'accueil */
.wide{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);text-align:left;min-width:0}
.wide .qi{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--qc);background:color-mix(in srgb, var(--qc) 15%, var(--surface))}
.wide .qi svg{width:21px;height:21px}
.wide .qtx{display:flex;flex-direction:column;min-width:0;flex:1}
.wide .qtx b{font-size:15px}
.wide .qtx span{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wide .go{flex:none;color:var(--muted);font-size:13px;font-weight:700;display:grid;place-items:center}
.wide .go svg{width:18px;height:18px}
.xbtn{background:linear-gradient(120deg, color-mix(in srgb, var(--amber) 12%, var(--surface)), var(--surface) 70%)}
.mitask{border-style:dashed}
.hstreak{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font-size:12px;font-weight:700;color:var(--amber);background:var(--amber-soft);border-radius:99px;padding:2px 9px 2px 6px}
.hstreak svg{width:13px;height:13px}
.card.mit{border:2px solid var(--amber);box-shadow:0 0 0 4px color-mix(in srgb, var(--amber) 14%, transparent), var(--shadow)}
.card.mit .task .title{font-size:16px}
.card.mit.mdone{border-color:var(--ok);box-shadow:var(--shadow)}
.mitok{margin:0;padding:0 14px 12px 50px;font-size:13px;color:var(--ok);font-weight:700}
.evening textarea,.evening input{background:var(--bg)}
.evening label small.opt,.field label small.opt{font-weight:500;text-transform:none;letter-spacing:0;color:var(--muted);margin-left:4px}
.jlist{display:flex;flex-direction:column;gap:10px}
.jentry{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;background:var(--bg)}
.jentry .lab::first-letter{text-transform:uppercase}
.jentry p{margin:0;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.jentry .jhard{color:var(--muted)}
.jentry .link{align-self:flex-start;border:0;background:none;color:var(--accent);font-weight:700;padding:2px 0;font-size:13px}

/* Explique-le */
.xcard textarea{width:100%;min-height:120px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;font:inherit;font-size:15px;line-height:1.5;resize:vertical}
.xprev summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--accent)}
.xprev p{margin:6px 0 0;font-size:14px;color:var(--muted);white-space:pre-wrap}
.xcompare{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.xcompare{grid-template-columns:1fr}}
.xmine,.xans{padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.xmine p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.xmine em{color:var(--muted)}
.xans{box-shadow:inset 0 4px 0 var(--dc), var(--shadow)}
.fcard.xq{min-height:0}
.fa0{font-size:17px;font-weight:500;white-space:pre-wrap;overflow-wrap:anywhere}

/* Révision mélangée */
.mixchip{display:inline-flex;align-items:center;gap:7px}
.mixchip i{width:9px;height:9px;border-radius:50%;background:var(--dc)}
.opts .mixchip[aria-pressed="true"] i{background:var(--accent-ink)}

/* Express */
.xtip{font-size:13px;background:var(--surface-2);border-radius:8px;padding:8px 10px;margin-top:4px}
.xtip b{color:var(--accent);margin-right:4px}

/* Badges */
.medal{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;--mc:var(--muted);color:var(--mc);background:color-mix(in srgb, var(--mc) 16%, var(--surface));border:2px solid var(--mc)}
.medal svg{width:20px;height:20px}
.medal.t0{--mc:var(--muted);border-style:dashed;opacity:.6}
.medal.t1{--mc:#B8743A} .medal.t2{--mc:#8E9AA7} .medal.t3{--mc:#C9971C}
.bcard{display:flex;align-items:center;gap:14px;padding:14px;width:100%;text-align:left}
.bmedals{display:flex;flex:none}
.bmedals .medal{width:34px;height:34px;margin-left:-8px;box-shadow:0 0 0 2px var(--surface)}
.bmedals .medal:first-child{margin-left:0}
.bmedals .medal svg{width:17px;height:17px}
.btxt{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.btxt b{font-size:15px}
.btxt span:not(.bar){font-size:12.5px;color:var(--muted)}
.btxt .bar{height:5px;margin-top:3px}
.bgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.bitem{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;background:var(--bg);min-width:0}
.bitem b{font-size:14px;margin-top:4px}
.bitem .btier{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.bitem .bar{width:100%;height:5px;margin-top:4px}
.bitem .bprog{font-size:11.5px;color:var(--muted)}
.bitem.locked b{color:var(--muted)}

/* Progression */
.ptrend{margin:0;font-weight:600}
.pchart{width:100%;height:auto;display:block;overflow:visible}
.pchart .cg{stroke:var(--line);stroke-width:1}
.pchart .cl{fill:var(--muted);font-size:10px;font-family:var(--f-mono)}
.pchart .ca{fill:color-mix(in srgb, var(--accent) 12%, transparent)}
.pchart .cp{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.pchart .cd{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.pchart .cd.last{fill:var(--accent)}
.pchart .cv{fill:var(--fg);font-size:12px;font-weight:700;font-family:var(--f-mono)}

/* Semaine de révision et QCM */
.covrow{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.covrow div{display:flex;flex-direction:column}
.covrow b{font-size:24px} .covrow b small{font-size:14px;color:var(--muted)}
.covrow span{font-size:12.5px;color:var(--muted)}
.covp{font-size:18px !important;font-weight:700;color:var(--accent) !important}
.covp.ok{color:var(--ok) !important}
.bar.cov{height:8px}
.fc7 .wbt{height:78px}
.fc7 .wn{font-size:11px;color:var(--muted);min-height:14px}
.wb i.stack{display:flex;flex-direction:column;background:var(--accent);overflow:hidden}
.wb i.stack i.nw{display:block;width:100%;max-width:none;border-radius:0;background:var(--c-cours);opacity:.85}
.fc7 .wb span{text-transform:capitalize}
.legend{margin:0;display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.lg-due{background:var(--accent)} .lg-new{background:var(--c-cours)}
.wrongs{display:flex;flex-direction:column;gap:8px}
.warnt{color:var(--danger) !important;font-weight:700}
.st.qcmt{color:var(--c-alt)}

/* Actualité */
nav.tabs button{font-size:10.5px}
nav.tabs .pill{padding:3px 11px}
.nlede{padding:16px;background:linear-gradient(135deg, color-mix(in srgb, var(--c-cours) 12%, var(--surface)), var(--surface) 75%)}
.nlede p{margin:4px 0 0;font-size:16px;line-height:1.55;font-weight:500;text-wrap:pretty}
.nfig{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.nfig .card{padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.nfig b{font-size:20px;overflow-wrap:anywhere}
.nfn{font-size:12px;color:var(--muted)}
.nlist{display:flex;flex-direction:column;gap:10px}
.nitem{padding:14px 16px;display:flex;flex-direction:column;gap:6px;box-shadow:inset 3px 0 0 var(--nc), var(--shadow)}
.ntag{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--nc)}
.nitem h3{margin:0;font-family:var(--f-display);font-size:17px;line-height:1.3;text-wrap:balance}
.nitem p{margin:0;font-size:14.5px;line-height:1.55;max-width:65ch}
.nwhy{background:var(--surface-2);border-radius:10px;padding:8px 10px;font-size:13.5px !important}
.nwhy b{display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.nsrc{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.nsrc a{font-size:12px;font-weight:700;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:3px 10px;background:var(--bg)}
.nsrc a:hover{border-color:var(--accent)}
.nquiz b{font-size:15px}
.qres .qr span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nexp{margin:0;font-size:13.5px;color:var(--muted)}
.nquiz .link{align-self:flex-start;border:0;background:none;color:var(--accent);font-weight:700;padding:0}
.icon-btn:disabled{opacity:.35}

.wlogo{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink)}
.wlogo svg{width:34px;height:34px}

/* Aide */
.icon-btn{width:38px;height:38px}
.hbtns{gap:6px}
.brand h1{font-size:clamp(21px,6.4vw,26px)}
@media (max-width:380px){.icon-btn{width:34px;height:34px;border-radius:10px}.icon-btn svg{width:18px;height:18px}.hbtns{gap:5px}}
.hhead{display:flex;gap:14px;align-items:flex-start}
.hq{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:800;font-size:24px}
.hhead h3{margin:0}
.hhead p{margin:4px 0 0}
.hlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.hlist li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:flex-start}
.hlist .hic{width:36px;height:36px;--mc:var(--accent);border-style:solid;opacity:1}
.hlist .hic svg{width:18px;height:18px}
.hlist b{font-size:15px}
.hlist p{margin:2px 0 0;font-size:14px;color:var(--muted);line-height:1.5}

.snaps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.snaps li{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px}
.snaps li.fine{border:0;background:none;padding:0}
.snaps b{display:block;font-size:14px}
.snaps b::first-letter{text-transform:uppercase}
.snaps span{font-size:12px;color:var(--muted)}

/* Pas de zoom */
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
@supports (-webkit-touch-callout:none){
  .field input,.field select,.field textarea,.xcard textarea,.evening textarea,.evening input{font-size:16px}
}

/* Astuces de calcul */
.chint{background:var(--amber-soft);border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.5;animation:rise .3s var(--ease)}
.chint b{display:flex;align-items:center;gap:6px;color:var(--amber);font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.chint b svg{width:15px;height:15px}
.btns .btn:has(> svg){display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btns .btn > svg{width:17px;height:17px;flex:none}
.corr .tip.rule{background:none;border:1px dashed var(--line);margin-top:6px}
.corr .tip.rule b{color:var(--amber)}
.hused{display:block;margin-top:4px;font-size:11.5px;color:var(--muted);font-style:italic}
.tipgrid{display:flex;flex-direction:column;gap:10px}
.tipcard{padding:0;overflow:hidden;box-shadow:inset 4px 0 0 var(--tc), var(--shadow)}
.tipcard summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 14px}
.tipcard summary::-webkit-details-marker{display:none}
.tipcard summary b{flex:1;font-family:var(--f-display);font-size:16px}
.tipcard .tico{--mc:var(--tc);width:34px;height:34px;border-style:solid;opacity:1}
.tipcard .tico svg{width:17px;height:17px}
.tipn{font-size:12px;color:var(--muted)}
.tipcard summary::after{content:"+";font-family:var(--f-mono);color:var(--muted);font-size:18px}
.tipcard[open] summary::after{content:"−"}
.tipcard ul{list-style:none;margin:0;padding:0 14px 14px;display:flex;flex-direction:column;gap:8px}
.tipcard li{display:flex;flex-direction:column;gap:3px;background:color-mix(in srgb, var(--tc) 8%, var(--surface));border-radius:10px;padding:9px 12px}
.tipcard li b{font-size:13px;color:var(--tc)}
.tipcard li span{font-size:14px;overflow-wrap:anywhere}

.msteps summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:baseline}
.msteps summary::-webkit-details-marker{display:none}
.msteps summary::after{content:'Détailler ▾';margin-left:auto;font-size:12px;color:var(--accent);font-weight:600}
.msteps[open] summary::after{content:'Masquer ▴'}
.msteps[open] summary .fine{display:none}
ol.steps{list-style:none;margin:8px 0 2px;padding:0;counter-reset:st;display:grid;gap:6px}
ol.steps li,.corr ol.steps li{counter-increment:st;position:relative;display:block;border:0;margin:0;padding:0 0 0 28px;line-height:1.45;font-variant-numeric:tabular-nums}
ol.steps li::before{content:counter(st);position:absolute;left:0;top:1px;width:20px;height:20px;border-radius:50%;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);font:700 11px/20px var(--mono,ui-monospace,monospace);text-align:center}
ol.steps li:not(:first-child)::after{content:'';position:absolute;left:9.5px;top:-6px;height:7px;border-left:1px solid var(--line)}
.extag{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:8px 12px;color:var(--fg);font:inherit;cursor:pointer;--uc:var(--accent)}
.extag.warm{--uc:var(--amber)} .extag.hot{--uc:var(--danger)}
.extag b{color:var(--uc);font-size:15px;white-space:nowrap}
.extag span{font-size:13px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exlink{display:flex;flex-direction:column;gap:2px;text-align:left;width:100%;border:1px dashed var(--line);background:none;border-radius:12px;padding:10px 12px;color:var(--fg);font:inherit;cursor:pointer}
.exlink b{color:var(--accent);font-size:14px}
.exlink span{font-size:13px;color:var(--muted)}
#t-when-h{margin:6px 0 0}
.fold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:4px 0;-webkit-tap-highlight-color:transparent}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary>span{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.fold>summary b{font-size:16px}
.fold>summary small{font-size:13px;color:var(--muted)}
.fold>summary i{width:32px;height:32px;border-radius:50%;background:var(--surface-2);flex:none;position:relative;transition:transform .25s ease}
.fold>summary i::before{content:'';position:absolute;left:12px;top:10px;width:8px;height:8px;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(45deg)}
.fold[open]>summary i{transform:rotate(180deg)}
.foldin{display:flex;flex-direction:column;gap:12px;padding-top:12px;animation:foldin .25s ease}
@keyframes foldin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
svg.wmap{display:block;width:100%;height:auto;margin-top:10px;border-radius:12px;background:var(--surface-2);touch-action:manipulation}
.wmap .sea{fill:color-mix(in srgb,var(--accent) 7%,var(--surface-2))}
.wmap path{fill:color-mix(in srgb,var(--fg) 13%,var(--surface));stroke:var(--surface);stroke-width:.35;stroke-linejoin:round;transition:fill .2s}
.wmap .dot{fill:color-mix(in srgb,var(--fg) 30%,var(--surface));stroke:var(--surface);stroke-width:.3}
.wmap.tap [data-mc]{cursor:pointer}
.wmap.tap path[data-mc]:active,.wmap.tap .dot[data-mc]:active{fill:var(--accent)}
.wmap .good{fill:var(--ok)} .wmap .bad{fill:var(--danger)} .wmap .hl{fill:var(--amber)}
.wmap .dot.good,.wmap .dot.bad,.wmap .dot.hl{stroke:var(--fg);stroke-width:.4}
.fcard.mapcard{min-height:0;padding-bottom:14px}
.mhint{text-align:center;margin:8px 0 0}
.minfo{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--surface-2);display:flex;flex-direction:column;gap:3px;text-align:left}
.minfo b{color:var(--ok)} .minfo.ko b{color:var(--danger)}
.minfo span{font-size:13px;color:var(--muted)}
.packcta{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;padding:12px;text-align:left;font:inherit;color:var(--fg);cursor:pointer;border:1px solid var(--line)}
.packcta>span:nth-child(2){flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.packcta small{color:var(--muted);font-size:13px}
.pkglobe{width:64px;flex:none}.pkglobe svg.wmap{margin:0;border-radius:10px}
.packcta>svg{width:18px;height:18px;flex:none;color:var(--muted)}
.packl{display:flex;flex-direction:column;gap:8px}
.packi{display:flex;align-items:center;gap:12px;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font:inherit;color:var(--fg);cursor:pointer}
.packi i{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:none;position:relative}
.packi[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.packi[aria-pressed="true"] i{background:var(--accent);border-color:var(--accent)}
.packi[aria-pressed="true"] i::after{content:'';position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid var(--surface);border-width:0 2px 2px 0;transform:rotate(45deg)}
.packi span{display:flex;flex-direction:column;gap:1px}.packi small{color:var(--muted);font-size:13px}
.packi:disabled{opacity:.5}
.why{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--surface-2);text-align:left;font-size:14px;line-height:1.45;border-left:3px solid var(--accent)}
.why b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-bottom:3px}
.why p{margin:0}.why .wn{margin-top:6px;color:var(--muted)}
.qopts + .why{margin-top:4px}
.corr .why{font-size:13px;margin-top:6px}
.xlink{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.xlink>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.xlink b{font-size:14px}.xlink span{font-size:13px;color:var(--muted)}
.xlink .link{border:0;background:none;color:var(--accent);font-weight:700;font:inherit;font-weight:700;cursor:pointer}
.packi.xc b{font-weight:600;font-size:14px}
/* Interactions */


button{transition:transform .14s var(--ease), background-color .25s, color .25s, border-color .25s, opacity .25s}
button:active{transform:scale(.96)}
.cell:active{transform:none}
html.theming *,html.theming *::before{transition:background-color .45s ease, color .45s ease, border-color .45s ease, fill .45s, stroke .45s !important}

/* Animations */
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes ringfill{from{stroke-dashoffset:var(--from)}to{stroke-dashoffset:var(--to)}}
@keyframes pop{0%{transform:scale(.55)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes strike{from{background-size:0 1.5px}}
@keyframes sheetin{from{transform:translateY(100%)}}
@keyframes sheetout{to{transform:translateY(100%)}}
@keyframes toastin{from{opacity:0;transform:translate(-50%,12px) scale(.96)}}
@keyframes flipin{from{transform:perspective(1100px) rotateY(-88deg);opacity:.4}}
@keyframes cardin{from{transform:translateX(36px) rotate(1.5deg);opacity:0}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes wave{35%{background:var(--accent-soft);transform:scale(.9)}}
@keyframes pillin{from{transform:scale(.5);opacity:0}}
@keyframes glow{50%{box-shadow:0 0 0 6px color-mix(in srgb, var(--accent) 18%, transparent), var(--shadow)}}
.anim>*{animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0) * 55ms)}
.anim .bar i{transform-origin:left;animation:grow .9s var(--ease) .2s both}
.ring .arc{animation:ringfill 1s var(--ease) both}
.task.just .check{animation:pop .38s var(--ease)}
.task.just.done .title span{animation:strike .45s ease .05s both}
.scrim{animation:fade .22s ease}
.sheet{animation:sheetin .36s var(--ease)}
.scrim.closing{animation:fade .2s ease reverse forwards}
.scrim.closing .sheet{animation:sheetout .22s ease forwards}
.toast.show{animation:toastin .3s var(--ease)}
.fcard.flip{animation:flipin .5s var(--ease)}
.fcard.next{animation:cardin .4s var(--ease)}
.qcard.badf{animation:shake .38s ease}
.qcard.good .calc-q{animation:pop .3s var(--ease)}
.calc-q.qin{animation:rise .35s var(--ease)}
.cell.placed{animation:pop .32s var(--ease)}
.cell.wave{animation:wave .65s ease var(--d,0ms)}
nav.tabs button[aria-current="page"] .pill{animation:pillin .35s var(--ease)}
.daily .btn.primary,.fab{animation:glow 2.6s ease-in-out 1s 2}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
html.nomotion *,html.nomotion *::before{animation:none!important;transition:none!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* Apparence */
.themes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.theme{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 8px 10px;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}
.theme.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.theme .sw{display:flex;flex-direction:column;gap:5px;border-radius:9px;padding:9px;height:76px;position:relative;overflow:hidden}

.theme .sw .s2{height:8px;width:60%}

.theme-why b{display:block;font-family:var(--f-display);font-size:15px;margin-bottom:2px}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:14px;border:0;background:none;padding:6px 0;text-align:left;width:100%}
.toggle span{display:flex;flex-direction:column;gap:2px;min-width:0}
.toggle span small{color:var(--muted);font-size:13px}
.toggle i{flex:none;width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;transition:background .25s}
.toggle i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgb(0 0 0 / .25);transition:transform .25s var(--ease)}
.toggle[aria-pressed="true"] i{background:var(--accent)}
.toggle[aria-pressed="true"] i::after{transform:translateX(18px)}
.fine{font-size:12px;color:var(--muted);margin:0}

<script>
(() => {
/* ---------- Dates ---------- */
const pad = n => String(n).padStart(2,'0');
const key = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const monday = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - (x.getDay()+6)%7); return x; };
const isoWeek = d => { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-day); const y0 = new Date(Date.UTC(t.getUTCFullYear(),0,1)); return Math.ceil(((t - y0)/86400000 + 1)/7); };
const fmt = (d, o) => new Intl.DateTimeFormat('fr-FR', o).format(d);
const todayKey = () => key(new Date());

/* ---------- Apparence ---------- */
const PAL_KEYS = ['bg','surface','surface-2','fg','muted','line','accent','accent-ink','accent-soft','amber','amber-soft','danger','danger-soft','ok','c-cours','c-alt','c-perso'];
const PALS = {
  foret:{ name:'Forêt', tag:'Attention', why:'Le vert est associé à la récupération de l’attention : dans une étude, un simple coup d’œil de 40 secondes à du vert a suffi à mieux se reconcentrer ensuite. Idéal pour enchaîner les tâches.',
    light:['#EEF2EF','#FFFFFF','#E3EAE5','#16201C','#5B6A63','#D3DDD7','#1E5B4F','#FFFFFF','#D5E7E0','#C26B17','#F6E3CF','#B3362E','#F6D9D6','#2E7D4F','#3B5BA9','#8A4FB0','#C26B17'],
    dark:['#0F1513','#18201D','#222C28','#E6EDE9','#93A39C','#2C3833','#62C3A9','#0B1311','#1E3A33','#E9A35A','#3A2A1A','#EF7A70','#3D1F1C','#6CCB92','#88A6EE','#C49AE6','#E9A35A'] },
  ocean:{ name:'Océan', tag:'Calme', why:'Le bleu est associé au calme et à la réflexion : les études le relient à un état plus détendu et propice aux tâches qui demandent de prendre du recul. Adapté aux longues séances.',
    light:['#EDF2F8','#FFFFFF','#E1E9F3','#132036','#55657C','#D0DBE8','#2456A6','#FFFFFF','#DBE6F7','#B8681A','#F5E4D0','#B3362E','#F6D9D6','#2C7A55','#1F7A8C','#7A4FB5','#B8681A'],
    dark:['#0C121E','#141C2B','#1E2839','#E3EAF5','#8D9AB0','#283247','#82AAF2','#0A1120','#1C2B46','#E6A25C','#392A1B','#EF7A70','#3D1F1C','#6CC596','#6CC3D3','#B79AE8','#E6A25C'] },
  papier:{ name:'Papier', tag:'Lecture', why:'Un fond crème et un texte brun foncé imitent le livre imprimé : le contraste reste net sans l’éblouissement du blanc pur. Le plus confortable pour lire beaucoup de cartes.',
    light:['#F2EBDD','#FBF7EE','#EAE0CD','#2B241C','#6E6151','#DCCFB8','#8A4B2A','#FFF8EE','#F0DCCB','#A8641A','#F1E0C6','#A33A2C','#F2D7CF','#4F7A3A','#3E6A8A','#7B4D84','#A8641A'],
    dark:['#1B1713','#241F19','#2E2820','#ECE2D1','#A79985','#3A3228','#E0A57A','#1B1713','#3D2C20','#E3B06A','#3A2C1A','#E88B7D','#3D221D','#9CC27E','#8FB4D0','#C49FCB','#E3B06A'] },
  nuit:{ name:'Nuit', tag:'Soirée', why:'Fond très sombre et couleurs chaudes, presque sans lumière bleue. Le soir, la lumière bleue des écrans retarde la mélatonine et donc l’endormissement : ce thème la limite au maximum.',
    dark:['#120E0B','#1B1612','#261F19','#F0DCC0','#A68F75','#352A20','#F0A35E','#1A120B','#3B2817','#E8C072','#382B17','#E98A6E','#3B2018','#BFC46E','#D9B58A','#D99C9C','#E8C072'] }
};
const SH_L = '0 1px 2px rgb(30 35 40 / .05), 0 6px 18px rgb(30 35 40 / .06)', SH_D = '0 1px 0 rgb(255 255 255 / .02), 0 8px 24px rgb(0 0 0 / .25)';
(() => { const blk = (sel, arr, dark) => `${sel}{${PAL_KEYS.map((k,i)=>`--${k}:${arr[i]}`).join(';')};--shadow:${dark?SH_D:SH_L};color-scheme:${dark?'dark':'light'}}`;
  const css = Object.entries(PALS).map(([id,p]) => id==='nuit' ? blk(':root[data-pal="nuit"]', p.dark, true)
    : blk(`:root[data-pal="${id}"][data-tm="light"]`, p.light, false) + blk(`:root[data-pal="${id}"][data-tm="dark"]`, p.dark, true)).join('\n');
  const st = document.createElement('style'); st.textContent = css; document.body.appendChild(st); })();
const LOOK_KEY = 'tempo.look';
let look = { pal:'foret', mode:'auto', night:false, motion:true };
try { Object.assign(look, JSON.parse(localStorage.getItem(LOOK_KEY)) || {}); } catch(e){}
const saveLook = () => { try { localStorage.setItem(LOOK_KEY, JSON.stringify(look)); } catch(e){} };
const nightNow = () => { const h = new Date().getHours(); return h>=21 || h<6; };
function isDark(){ if (look.mode==='light') return false; if (look.mode==='dark') return true;
  const t = document.documentElement.getAttribute('data-theme'); if (t==='dark' || t==='light') return t==='dark';
  try { return matchMedia('(prefers-color-scheme: dark)').matches; } catch(e){ return false; } }
const curPal = () => (look.night && nightNow()) ? 'nuit' : look.pal;
function applyLook(smooth){
  const r = document.documentElement;
  if (smooth && look.motion){ r.classList.add('theming'); clearTimeout(applyLook.t); applyLook.t = setTimeout(()=>r.classList.remove('theming'), 500); }
  r.dataset.pal = curPal(); r.dataset.tm = isDark() ? 'dark' : 'light'; r.classList.toggle('nomotion', !look.motion);
}
applyLook(false);
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => applyLook(true)); } catch(e){}
new MutationObserver(() => { const r = document.documentElement, want = isDark() ? 'dark' : 'light'; if (r.dataset.tm !== want) applyLook(true); }).observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
setInterval(() => { if (document.documentElement.dataset.pal !== curPal()) applyLook(true); }, 60000);
const motionOK = () => look.motion && !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
function confetti(){
  if (!motionOK()) return;
  const cv = document.createElement('canvas'); cv.className = 'confetti'; document.body.appendChild(cv);
  const dpr = window.devicePixelRatio || 1, W = innerWidth, H = innerHeight; cv.width = W*dpr; cv.height = H*dpr;
  const x = cv.getContext('2d'); x.scale(dpr,dpr);
  const cs = getComputedStyle(document.documentElement), cols = ['--accent','--amber','--ok','--c-cours','--c-alt'].map(v=>cs.getPropertyValue(v).trim());
  const P = [...Array(120)].map(() => ({ x:W/2+(Math.random()-.5)*W*.35, y:H*.38, vx:(Math.random()-.5)*10, vy:-Math.random()*12-4, r:Math.random()*6+5, a:Math.random()*6, va:(Math.random()-.5)*.35, c:cols[Math.floor(Math.random()*cols.length)] }));
  const t0 = performance.now();
  const f = t => { const k = (t-t0)/1000; x.clearRect(0,0,W,H);
    for (const p of P){ p.vy += .36; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va; x.save(); x.globalAlpha = Math.max(0, 1-k/1.9); x.translate(p.x,p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); x.restore(); }
    if (k < 1.9) requestAnimationFrame(f); else cv.remove(); };
  requestAnimationFrame(f);
}
function lookSheet(){
  const dark = isDark();
  const card = (id,p) => { const v = (dark || !p.light) ? p.dark : p.light;
    return `<button class="theme ${look.pal===id?'on':''}" data-pick="${id}" aria-pressed="${look.pal===id}">
      <span class="sw" style="background:${v[0]}"><i class="s1" style="background:${v[1]}"></i><i class="s2" style="background:${v[3]};opacity:.75"></i><i class="s3" style="background:${v[4]};opacity:.6"></i><i class="dot" style="background:${v[6]}"></i></span>
      <span class="tn"><b>${p.name}</b><em>${p.tag}</em></span></button>`; };
  const why = id => `<b>Pourquoi ${PALS[id].name} ?</b>${PALS[id].why}`;
  sheet(`<h3>Apparence</h3>
    <div class="themes" id="lk-themes">${Object.entries(PALS).map(([id,p])=>card(id,p)).join('')}</div>
    <div class="theme-why" id="lk-why">${why(look.pal)}</div>
    <div class="field"><span class="lab">Luminosité</span><div class="seg" id="lk-mode">${[['auto','Auto'],['light','Clair'],['dark','Sombre']].map(([k,l])=>`<button data-mode="${k}" aria-pressed="${look.mode===k}">${l}</button>`).join('')}</div>
      <p class="fine" id="lk-mode-note">${look.pal==='nuit' ? 'Nuit reste toujours sombre.' : 'Auto suit le réglage de ton téléphone. Le mode clair se lit mieux en pleine lumière, le sombre éblouit moins dans le noir.'}</p></div>
    <button class="toggle" id="lk-night" aria-pressed="${look.night}"><span><b>Nuit automatique le soir</b><small>Passe en thème Nuit de 21 h à 6 h, quel que soit ton thème.</small></span><i></i></button>
    <button class="toggle" id="lk-motion" aria-pressed="${look.motion}"><span><b>Animations</b><small>Transitions, cartes qui se retournent, confettis.</small></span><i></i></button>
    <p class="fine">Les effets des couleurs mesurés dans les études restent modestes. Ce qui compte le plus : un écran confortable pour tes yeux et des pauses régulières.</p>
    <div class="btns"><button class="btn primary" data-close>Terminé</button></div>`, s => {
    const refresh = () => {
      s.querySelectorAll('[data-pick]').forEach(b => { const on = b.dataset.pick===look.pal; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
      s.querySelector('#lk-why').innerHTML = why(look.pal);
      s.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode===look.mode));
      s.querySelector('#lk-mode-note').textContent = look.pal==='nuit' ? 'Nuit reste toujours sombre.' : 'Auto suit le réglage de ton téléphone. Le mode clair se lit mieux en pleine lumière, le sombre éblouit moins dans le noir.';
      s.querySelector('#lk-night').setAttribute('aria-pressed', look.night); s.querySelector('#lk-motion').setAttribute('aria-pressed', look.motion);
      const dk = isDark(); s.querySelectorAll('[data-pick]').forEach(b => { const p = PALS[b.dataset.pick], v = (dk || !p.light) ? p.dark : p.light, sp = b.querySelectorAll('.sw, .sw i');
        sp[0].style.background = v[0]; sp[1].style.background = v[1]; sp[2].style.background = v[3]; sp[3].style.background = v[4]; sp[4].style.background = v[6]; });
    };
    const upd = () => { saveLook(); applyLook(true); refresh(); };
    s.querySelector('#lk-themes').addEventListener('click', e => { const b = e.target.closest('[data-pick]'); if (b){ look.pal = b.dataset.pick; upd(); } });
    s.querySelector('#lk-mode').addEventListener('click', e => { const b = e.target.closest('[data-mode]'); if (b){ look.mode = b.dataset.mode; upd(); } });
    s.querySelector('#lk-night').addEventListener('click', () => { look.night = !look.night; upd(); });
    s.querySelector('#lk-motion').addEventListener('click', () => { look.motion = !look.motion; upd(); });
  });
}

/* ---------- Stockage ---------- */
const STORE = 'tempo.v1';
const uid = () => Math.random().toString(36).slice(2,10);
function load(){ try { const s = JSON.parse(localStorage.getItem(STORE)); if (s && Array.isArray(s.tasks)) return s; } catch(e){} return null; }
function save(){ try { localStorage.setItem(STORE, JSON.stringify(state)); } catch(e){} }

function seed(){
  const t = new Date(), k0 = key(t), k1 = key(addDays(t,1)), k2 = key(addDays(t,2)), wk = key(monday(t));
  return { v:1, examples:true, tasks:[
    {id:uid(), title:"Relire le chapitre amortissements", date:k0, cat:"cours", prio:true, done:false, ex:true},
    {id:uid(), title:"Lettrage des factures fournisseurs", date:k0, cat:"alternance", prio:false, done:true, ex:true},
    {id:uid(), title:"Séance d'anglais (25 min)", date:k0, cat:"perso", prio:false, done:false, ex:true},
    {id:uid(), title:"Préparer les questions pour le tuteur", date:k1, cat:"alternance", prio:false, done:false, ex:true},
    {id:uid(), title:"Exercices TVA déductible / collectée", date:k2, cat:"cours", prio:true, done:false, ex:true},

    const u = b%10;
    const tip = u>=6 ? `Arrondis : ${nf(a)} + ${nf(b+10-u)} − ${10-u}` : u===0 ? `Ajoute les dizaines directement` : `${nf(a)} + ${nf(b-u)} = ${nf(a+b-u)}, puis + ${u}`;

/* ---------- Sudoku : moteur ---------- */
const SU = (() => {
  const R_ = i => (i/9)|0, C_ = i => i%9, B_ = i => ((R_(i)/3)|0)*3 + ((C_(i)/3)|0);
  const UNITS = [];
  for (let r=0;r<9;r++) UNITS.push({ t:'row', n:r, c:[...Array(9)].map((_,k)=>r*9+k) });
  for (let c=0;c<9;c++) UNITS.push({ t:'col', n:c, c:[...Array(9)].map((_,k)=>k*9+c) });
  for (let b=0;b<9;b++) UNITS.push({ t:'box', n:b, c:[...Array(9)].map((_,k)=>(((b/3)|0)*3+((k/3)|0))*9 + (b%3)*3 + k%3) });
  const PEERS = [...Array(81)].map((_,i)=>[...new Set(UNITS.filter(u=>u.c.includes(i)).flatMap(u=>u.c))].filter(p=>p!==i));
  const ALL = 0x3FE, bit = d => 1<<d;
  const pc = m => { let n=0; while (m){ m &= m-1; n++; } return n; };
  const digits = m => { const a=[]; for (let d=1; d<=9; d++) if (m & bit(d)) a.push(d); return a; };
  const cands = (g,i) => { let m = ALL; for (const p of PEERS[i]) if (g[p]) m &= ~bit(g[p]); return m; };
  const BOXN = ['en haut à gauche','en haut au centre','en haut à droite','au milieu à gauche','du centre','au milieu à droite','en bas à gauche','en bas au centre','en bas à droite'];
  const uname = u => u.t==='row' ? `la ligne ${u.n+1}` : u.t==='col' ? `la colonne ${u.n+1}` : `le carré ${BOXN[u.n]}`;
  const shuffle = (a,R) => { for (let k=a.length-1;k>0;k--){ const j=Math.floor(R()*(k+1)); [a[k],a[j]]=[a[j],a[k]]; } return a; };
  function fill(R){ const g = Array(81).fill(0);
    const rec = i => { if (i===81) return true; for (const d of shuffle(digits(cands(g,i)),R)){ g[i]=d; if (rec(i+1)) return true; } g[i]=0; return false; };
    rec(0); return g; }
  function step(g, C, maxTech){
    for (const t of ['box','row','col']) for (const u of UNITS) if (u.t===t) for (let d=1; d<=9; d++){
      let pos=-1, n=0; for (const i of u.c){ if (g[i]===d){ n=-1; break; } if (!g[i] && (C[i]&bit(d))){ n++; pos=i; } }
      if (n===1) return { kind:'place', i:pos, d, how:'hidden', unit:u };
    }
    for (let i=0;i<81;i++) if (!g[i] && pc(C[i])===1) return { kind:'place', i, d:digits(C[i])[0], how:'naked' };
    if (maxTech < 2) return null;
    for (const u of UNITS){ const em = u.c.filter(i=>!g[i] && pc(C[i])===2);
      for (let a=0;a<em.length;a++) for (let b=a+1;b<em.length;b++) if (C[em[a]]===C[em[b]]){ const m = C[em[a]]; let ch=false;
        for (const i of u.c) if (i!==em[a] && i!==em[b] && !g[i] && (C[i]&m)){ C[i] &= ~m; ch=true; }
        if (ch){ const [x,y] = digits(m); return { kind:'elim', unit:u, cells:[em[a],em[b]], text:`Paire nue dans ${uname(u)} : deux cases ne peuvent contenir que ${x} ou ${y}, donc ${x} et ${y} sont exclus des autres cases.` }; } } }
    for (const u of UNITS) for (let d=1; d<=9; d++){
      const pos = u.c.filter(i=>!g[i] && (C[i]&bit(d))); if (pos.length<2) continue;
      if (u.t==='box'){ for (const lt of ['row','col']){ const f = lt==='row' ? R_ : C_;
          if (pos.every(i=>f(i)===f(pos[0]))){ const line = UNITS.find(v=>v.t===lt && v.n===f(pos[0])); let ch=false;
            for (const i of line.c) if (B_(i)!==u.n && !g[i] && (C[i]&bit(d))){ C[i] &= ~bit(d); ch=true; }
            if (ch) return { kind:'elim', unit:line, cells:pos, text:`Pointage : dans ${uname(u)}, le ${d} est forcément sur ${uname(line)}, donc il est exclu du reste de ${uname(line)}.` }; } } }

function ensureRoutines(){ if (!state.routines) state.routines = []; }
function materialize(k){
  ensureRoutines(); let ch = false;
  for (const r of state.routines){
    if (k < r.start || !r.days.includes(wdIdx(k)) || (r.skip||[]).includes(k)) continue;
    if (state.tasks.some(t => t.routine===r.id && t.date===k)) continue;
    state.tasks.push({ id:uid(), title:r.title, date:k, cat:r.cat, prio:r.prio, done:false, routine:r.id, deck:r.deck||null }); ch = true;
  }

}
function skipRoutineDate(t){ if (!t.routine || !t.date) return; const r = (state.routines||[]).find(x=>x.id===t.routine); if (r){ r.skip = r.skip || []; if (!r.skip.includes(t.date)) r.skip.push(t.date); r.skip = r.skip.slice(-200); } }

/* ---------- Glisser une tâche ---------- */
let sw = null, suppressClick = false;
view.addEventListener('click', e => { if (suppressClick){ e.stopImmediatePropagation(); e.preventDefault(); } }, true);
view.addEventListener('pointerdown', e => {
  const li = e.target.closest('.task'); if (!li || e.target.closest('.actions') || (e.pointerType==='mouse' && e.button!==0)) return;
  sw = { li, x:e.clientX, y:e.clientY, dx:0, on:false, id:e.pointerId };
});
view.addEventListener('pointermove', e => {
  if (!sw || e.pointerId!==sw.id) return; const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
  if (!sw.on){ if (Math.abs(dx)>12 && Math.abs(dx) > Math.abs(dy)*1.4){ sw.on = true; sw.li.classList.add('swiping'); try { sw.li.setPointerCapture(e.pointerId); } catch(_){} }
    else if (Math.abs(dy)>12){ sw = null; return; } else return; }
  const t = state.tasks.find(x=>x.id===sw.li.dataset.id); let d = dx;
  if (d<0 && !(t && t.date)) d = Math.max(d,-24);
  e.preventDefault(); sw.dx = d; sw.li.style.setProperty('--dx', d+'px'); sw.li.dataset.dir = d>0 ? 'right' : 'left';
  sw.li.dataset.label = d>0 ? (t && t.done ? 'À refaire' : 'Fait') : 'Demain';
  sw.li.classList.toggle('armed', Math.abs(d) > 80);
});
const swEnd = () => {
  if (!sw) return; const s = sw; sw = null; if (!s.on) return;
  s.li.classList.remove('swiping'); suppressClick = true; setTimeout(()=>suppressClick=false, 60);
  const t = state.tasks.find(x=>x.id===s.li.dataset.id);
  if (t && s.dx > 80){ t.done = !t.done; if (t.done) t.doneAt = todayKey(); ui.justId = t.id; commit(); toast(t.done ? 'Tâche faite' : 'Tâche à refaire');
    const tl = tasksOn(todayKey()); if (t.done && t.date===todayKey() && tl.length>1 && tl.every(x=>x.done)){ confetti(); toast('Journée bouclée, bravo !'); } }
  else if (t && s.dx < -80 && t.date){ moveTask(t, key(addDays(parse(t.date),1))); commit(); toast('Reportée au lendemain'); }
  else { s.li.style.setProperty('--dx','0px'); delete s.li.dataset.dir; s.li.classList.remove('armed'); }
};
view.addEventListener('pointerup', swEnd); view.addEventListener('pointercancel', swEnd);

function ensureFocus(){ if (!state.focus) state.focus = { sessions:[], prefs:{ work:25, short:5, long:15 }, run:null }; }
const fmtMin = m => { m = Math.round(m); return m < 60 ? `${m} min` : `${Math.floor(m/60)} h${m%60 ? ' '+pad(m%60) : ''}`; };

function beep(n){ n = n || 3;
  try { actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    for (let k=0;k<n;k++){ const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + k*.28;
      o.type = 'sine'; o.frequency.value = k===n-1 ? 880 : 660; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.18,t+.02); g.gain.exponentialRampToValueAtTime(.001,t+.24);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+.26); } } catch(e){}
  try { navigator.vibrate && navigator.vibrate([180,80,180]); } catch(e){}
}
function focusStart(taskId){
  ensureFocus(); const P = state.focus.prefs, t = taskId ? state.tasks.find(x=>x.id===taskId) : null;
  state.focus.run = { phase:'work', endsAt:Date.now()+P.work*60000, dur:P.work*60000, paused:null, task:t?t.id:null, title:t?t.title:'', cat:t?t.cat:null, count:0, ask:false };
  try { actx = actx || new (window.AudioContext||window.webkitAudioContext)(); actx.resume && actx.resume(); } catch(e){}

}
function focusRecord(ms){
  const R = state.focus.run, min = Math.round(ms/60000); if (min < 1) return;
  state.focus.sessions.push({ id:uid(), d:todayKey(), min, cat:R.cat, task:R.task, title:R.title, full: ms >= R.dur - 1000 });

function focusAdvance(record){

  if (R.phase==='work'){
    if (record){ focusRecord(R.dur); R.count++; const t = R.task && state.tasks.find(x=>x.id===R.task);
      if (t){ t.pomos = (t.pomos||0) + 1; if (!t.done) R.ask = true; } beep(3); toast('Pomodoro terminé : pause !'); }
    const long = record && R.count>0 && R.count % 4 === 0; R.phase = long ? 'long' : 'short'; R.dur = (long ? P.long : P.short)*60000;
  } else { if (record){ beep(2); toast('Pause finie, on reprend.'); } R.phase = 'work'; R.dur = P.work*60000; R.ask = false; }

const IMG = (() => {
  let dbp; const cache = new Map();
  const db = () => dbp || (dbp = new Promise((res, rej) => { try { const r = indexedDB.open('tempo-img', 1); r.onupgradeneeded = () => r.result.createObjectStore('i'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch(e){ rej(e); } }));
  const tx = (mode, f) => db().then(d => new Promise((res, rej) => { const t = d.transaction('i', mode), rq = f(t.objectStore('i')); t.oncomplete = () => res(rq && rq.result); t.onerror = () => rej(t.error); }));
  return {
    put:(id, data) => { cache.set(id, data); return tx('readwrite', s => s.put(data, id)); },
    get:id => cache.has(id) ? Promise.resolve(cache.get(id)) : tx('readonly', s => s.get(id)).then(v => { if (v) cache.set(id, v); return v; }),
    del:id => { cache.delete(id); return tx('readwrite', s => s.delete(id)); }
  };
})();
function hydrateImgs(el){ (el||document).querySelectorAll('img[data-img]:not([src])').forEach(im => IMG.get(im.dataset.img).then(v => { if (v) im.src = v; else im.remove(); }).catch(() => im.remove())); }
function compressImage(file){
  return new Promise((res, rej) => { const fr = new FileReader();
    fr.onload = () => { const im = new Image();
      im.onload = () => { const k = Math.min(1, 1000/Math.max(im.width, im.height)), c = document.createElement('canvas');
        c.width = Math.round(im.width*k); c.height = Math.round(im.height*k); const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg', .82)); };
      im.onerror = rej; im.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file); });
}
function fmtText(s){
  let h = esc(s);
  h = h.replace(/frac\{([^{}]*)\}\{([^{}]*)\}/g, '<span class="frac"><span>$1</span><span>$2</span></span>');
  h = h.replace(/\^\{([^{}]*)\}/g, '<sup>$1</sup>').replace(/\^(-?[0-9A-Za-zÀ-ÿ]+(?:[.,][0-9]+)?)/g, '<sup>$1</sup>');
  h = h.replace(/_\{([^{}]*)\}/g, '<sub>$1</sub>').replace(/(\S)_([0-9A-Za-z]+)/g, '$1<sub>$2</sub>');
  h = h.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  return h;
}
function qcmOptions(card){
  const ans = card.a.trim();
  if (isQcmCard(card)){ const o = [ans, ...card.wrong.map(w=>String(w).trim()).filter(w=>w && w!==ans)].slice(0,5); for (let k=o.length-1;k>0;k--){ const j = Math.floor(Math.random()*(k+1)); [o[k],o[j]] = [o[j],o[k]]; } return o; }
  const distinct = pool => [...new Set(pool.filter(c => c.id!==card.id).map(c => c.a.trim()).filter(a => a && a!==ans))];
  let others = distinct(state.fc.cards.filter(c => c.deck===card.deck));
  if (others.length < 3) others = distinct(state.fc.cards);
  if (others.length < 3) return null;
  const L = ans.length;
  const picks = others.map(a => ({ a, d: Math.abs(a.length-L)/Math.max(L,8) + Math.random()*.45 })).sort((x,y)=>x.d-y.d).slice(0,3).map(x=>x.a);
  const opts = [ans, ...picks];
  for (let k=opts.length-1;k>0;k--){ const j = Math.floor(Math.random()*(k+1)); [opts[k],opts[j]] = [opts[j],opts[k]]; }
  return opts;
}
const mention = n => n>=16 ? 'Très bien' : n>=14 ? 'Bien' : n>=12 ? 'Assez bien' : n>=10 ? 'Passable' : 'À retravailler';
function startReviewList(list, deckId){
  if (!list.length) return;
  Object.assign(ui.fc, { view:'review', deck:deckId||null, queue:list.slice(1), cur:list[0], flipped:false, res:[0,0,0,0], total:list.length, optsFor:null, practice:new Set(), mixed:false, explText:'', label:null });
  render(); window.scrollTo(0,0);
}
function startExam(deckId, chap){
  startExamFromList(state.fc.cards.filter(c => c.deck===deckId && (chap===null || (c.chap||'')===chap)), { deck:deckId, chap });
}
function startExamFromList(pool, meta){
  const deckId = meta.deck, chap = meta.chap;
  const qs = pool.map(c=>({c, r:Math.random()})).sort((a,b)=>a.r-b.r).slice(0,20).map(x => ({ c:x.c, opts:qcmOptions(x.c) })).filter(q => q.opts);
  if (qs.length < 4) return toast('Il faut au moins 4 cartes avec des réponses différentes');
  Object.assign(ui.fc, { view:'exam', exam:{ deck:deckId, chap, qs, i:0, ans:[], label:meta.label||null, exId:meta.exId||null } });
  render(); window.scrollTo(0,0);
}
function examAnswer(k){
  const E = ui.fc.exam; E.ans.push(k); E.i++; ui.fc.anim = 'next';
  if (E.i >= E.qs.length){
    const ok = E.qs.filter((q,i) => q.opts[E.ans[i]]===q.c.a.trim()).length, note = Math.round(ok/E.qs.length*200)/10;
    E.ok = ok; E.note = note;
    state.fc.exams.push({ deck:E.deck, chap:E.chap, d:todayKey(), note, n:E.qs.length }); state.fc.exams = state.fc.exams.slice(-300);
    ui.fc.view = 'examres'; commit(); window.scrollTo(0,0); if (note >= 16) setTimeout(confetti, 300); return;
  }
  render();
}

function mixDecks(){ const F = state.fc, avail = F.decks.filter(d=>F.cards.some(c=>c.deck===d.id)); if (!ui.mix.decks) ui.mix.decks = avail.map(d=>d.id); return { avail, sel: ui.mix.decks.filter(id=>avail.some(d=>d.id===id)) }; }
function buildMix(){
  const M = ui.mix, F = state.fc, tk = todayKey(), { sel } = mixDecks(); let nl = Math.max(0, newLeft());
  const shuf = a => a.map(x=>({x, r:Math.random()})).sort((p,q)=>p.r-q.r).map(o=>o.x);
  const per = sel.map(id => { const cs = F.cards.filter(c=>c.deck===id);
    return { due:shuf(cs.filter(c=>c.seen && c.due<=tk)), fresh:cs.filter(c=>!c.seen), prac: M.practice ? shuf(cs.filter(c=>c.seen && c.due>tk)) : [] }; });
  const lists = per.map(p => p.due.map(c=>({ c, practice:false })));
  let more = true; while (nl > 0 && more){ more = false; per.forEach((p,i) => { if (nl > 0 && p.fresh.length){ lists[i].push({ c:p.fresh.shift(), practice:false }); nl--; more = true; } }); }
  per.forEach((p,i) => lists[i].push(...p.prac.map(c=>({ c, practice:true }))));
  const out = []; let k = 0, guard = 0;
  while (out.length < M.n && lists.some(l=>l.length) && guard++ < 5000){ const l = lists[k % lists.length]; if (l.length) out.push(l.shift()); k++; }
  return out;
}

function calcProgress(){
  const H = state.calc.history.filter(h=>!h.sim).slice(-15); if (H.length < 2) return '';
  const mode = ui.calc.prog || 'ok';
  const vals = H.map(h => mode==='ok' ? Math.round(100*h.ok/h.n) : Math.round(h.ms/h.n/100)/10);
  const W = 320, Hh = 150, pl = 40, pr = 14, pt = 18, pb = 26, max = mode==='ok' ? 100 : Math.max(2, Math.ceil(Math.max(...vals)/2)*2);
  const x = i => pl + i*(W-pl-pr)/(vals.length-1), y = v => pt + (1 - v/max)*(Hh-pt-pb);
  const lab = v => mode==='ok' ? `${v} %` : `${nf(v)} s`;
  const grid = [0, max/2, max].map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" class="cg"/><text x="${pl-6}" y="${y(t)+4}" class="cl" text-anchor="end">${lab(t)}</text>`).join('');
  const pts = vals.map((v,i)=>`${x(i)},${y(v)}`).join(' '), last = vals[vals.length-1];
  const avg = a => a.reduce((p,q)=>p+q,0)/a.length, k = Math.min(3, Math.floor(vals.length/2)), d = avg(vals.slice(-k)) - avg(vals.slice(0,k));
  const trend = mode==='ok' ? (Math.abs(d) < 3 ? 'Ta réussite est stable.' : d > 0 ? `Ta réussite progresse : +${Math.round(d)} points depuis tes premières séries.` : `Ta réussite baisse de ${Math.round(-d)} points : reprends un niveau plus facile un moment.`)
    : (Math.abs(d) < .3 ? 'Ta vitesse est stable.' : d < 0 ? `Tu calcules plus vite : ${nf(Math.round(-d*10)/10)} s de moins par calcul.` : `Tu es un peu plus lent (+${nf(Math.round(d*10)/10)} s par calcul), sans doute des séries plus difficiles.`);
  return `<section><h2>Progression <span class="seg mini">${[['ok','Réussite'],['speed','Vitesse']].map(([k2,l])=>`<button data-c-prog="${k2}" aria-pressed="${mode===k2}">${l}</button>`).join('')}</span></h2>
  <div class="card pad"><p class="ptrend">${trend}</p>
  <svg class="pchart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${mode==='ok' ? 'Pourcentage de réussite' : 'Secondes par calcul'} sur tes ${H.length} dernières séries">${grid}
    <polygon points="${x(0)},${y(0)} ${pts} ${x(vals.length-1)},${y(0)}" class="ca"/><polyline points="${pts}" class="cp"/>
    ${vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="${i===vals.length-1 ? 4.5 : 2.5}" class="cd ${i===vals.length-1?'last':''}"/>`).join('')}
    <text x="${x(vals.length-1)}" y="${Math.max(12, y(last)-9)}" text-anchor="end" class="cv">${lab(last)}</text>
    <text x="${pl}" y="${Hh-6}" class="cl">${fmt(parse(H[0].d),{day:'numeric',month:'short'})}</text><text x="${W-pr}" y="${Hh-6}" class="cl" text-anchor="end">${fmt(parse(H[H.length-1].d),{day:'numeric',month:'short'})}</text></svg>
  <p class="fine">Tes ${H.length} dernières séries, hors prépa IAE.${mode==='speed' ? ' Temps moyen par calcul : plus bas, c’est mieux.' : ''}</p></div></section>`;
}

    const soon = key(addDays(new Date(), 2)), dl = c => { const d = key(addDays(parse(c.add), 6)); return d < tk ? soon : d; };
    let r = 0; for (let k=1; k<=7; k++){ const lim = key(addDays(new Date(), k-1)); r = Math.max(r, un.filter(c => dl(c) <= lim).length / k); }
    nd.q = Math.min(60, Math.max(10, Math.ceil(r)));
  }
  return nd.q;
}
function pickDue(ivl, self){
  if (ivl <= 2) return key(addDays(new Date(), ivl));
  const cap = weeklyOn() ? 7 : 365, lo = Math.max(1, Math.round(ivl*.85)), hi = Math.min(cap, Math.max(lo, Math.round(ivl*1.12)));
  const load = {}; state.fc.cards.forEach(c => { if (c!==self && c.seen) load[c.due] = (load[c.due]||0) + 1; });
  let best = null;
  for (let d=lo; d<=hi; d++){ const k = key(addDays(new Date(), d)), n = load[k]||0; if (!best || n < best.n || (n===best.n && Math.abs(d-ivl) < Math.abs(best.d-ivl))) best = { k, n, d }; }
  return best.k;
}
function clampWeekly(){
  const lim = key(addDays(new Date(), 7)), load = {};
  state.fc.cards.forEach(c => { if (c.seen && c.due <= lim) load[c.due] = (load[c.due]||0) + 1; });
  let moved = 0;
  state.fc.cards.forEach(c => { if (!c.seen || c.due <= lim) return;
    let best = null; for (let d=1; d<=7; d++){ const k = key(addDays(new Date(), d)), n = load[k]||0; if (!best || n < best.n) best = { k, n }; }
    c.due = best.k; c.ivl = Math.min(c.ivl, 7); load[best.k] = (load[best.k]||0) + 1; moved++; });
  return moved;
}
function weekPanel(){

/* ---------- Copies automatiques ---------- */
const SNAP = (() => {
  let dbp;
  const db = () => dbp || (dbp = new Promise((res, rej) => { try { const r = indexedDB.open('tempo-copies', 1); r.onupgradeneeded = () => r.result.createObjectStore('s'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch(e){ rej(e); } }));
  const tx = (mode, f) => db().then(d => new Promise((res, rej) => { const t = d.transaction('s', mode), rq = f(t.objectStore('s')); t.oncomplete = () => res(rq && rq.result); t.onerror = () => rej(t.error); }));
  const put = (k, v) => tx('readwrite', s => s.put(v, k));
  const all = () => db().then(d => new Promise((res, rej) => { const out = [], t = d.transaction('s', 'readonly'), c = t.objectStore('s').openCursor();
    c.onsuccess = () => { const cur = c.result; if (cur){ out.push({ key:cur.key, ...cur.value }); cur.continue(); } }; t.oncomplete = () => res(out); t.onerror = () => rej(t.error); }));
  const del = k => tx('readwrite', s => s.delete(k));
  async function prune(){
    const L = await all(), days = L.filter(x=>x.kind==='day').sort((a,b)=>b.key.localeCompare(a.key)), before = L.filter(x=>x.kind==='before').sort((a,b)=>b.at.localeCompare(a.at));
    await Promise.all([...days.slice(7), ...before.slice(3)].map(x => del(x.key)));
  }
  const summary = st => ({ tasks:(st.tasks||[]).length, cards:(st.fc && st.fc.cards || []).length, goals:(st.goals||[]).length });
  async function save(kind, label){
    const at = new Date().toISOString(), data = JSON.stringify(state), k = kind==='day' ? todayKey() : 'avant-' + at;
    await put(k, { kind, at, label: label || '', data, sum: summary(state) }); await prune();
  }
  let t = null;
  return {
    later(){ clearTimeout(t); t = setTimeout(() => save('day').catch(()=>{}), 4000); },
    now: () => save('day').catch(()=>{}),
    before: label => save('before', label).catch(()=>{}),
    list: () => all().then(L => L.sort((a,b)=>b.at.localeCompare(a.at))).catch(() => []),
    get: k => tx('readonly', s => s.get(k))
  };
})();

function ruleFor(q){
  const t = q.q;
  switch (q.cat){
    case 'add': return 'Arrondis le deuxième nombre à la dizaine au-dessus, puis corrige : 47 + 38 = 47 + 40 − 2. Ou ajoute d’abord les dizaines, puis les unités.';
    case 'sub': return 'Arrondis ce que tu retires, puis rends la différence : 83 − 29 = 83 − 30 + 1. Tu peux aussi compter en avançant du petit nombre jusqu’au grand.';
    case 'mul':
      if (/× 25$/.test(t)) return '25 = 100 ÷ 4 : multiplier par 25, c’est multiplier par 100 puis diviser par 4.';
      if (/× 5$/.test(t) || /^5 ×/.test(t)) return '5 = 10 ÷ 2 : multiplier par 5, c’est multiplier par 10 puis prendre la moitié.';
      if (/× 9$/.test(t) || /^9 ×/.test(t)) return '9 = 10 − 1 : multiplie par 10, puis retire le nombre une fois.';
      if (/× 11$/.test(t)) return '11 = 10 + 1 : multiplie par 10 et ajoute le nombre. Pour deux chiffres, glisse leur somme au milieu : 43 × 11 = 4|7|3 = 473 (avec retenue si la somme dépasse 9).';
      if (/× 15$/.test(t)) return '15 = 10 + 5 : multiplie par 10, puis ajoute la moitié de ce résultat.';
      if (/^\d ×|× \d$/.test(t) && q.a <= 90) return 'Pars d’un résultat que tu connais (× 2, × 5, × 10), puis ajoute ou retire une fois le nombre.';
      return 'Distributivité : découpe un facteur en dizaines + unités et multiplie chaque morceau : 34 × 26 = 34 × 20 + 34 × 6.';
    case 'div':
      if (/÷ 5$/.test(t)) return 'Diviser par 5, c’est diviser par 10 puis multiplier par 2.';
      return 'Pense à la multiplication inverse : combien de fois le diviseur tient dans le nombre ? Découpe le nombre en morceaux faciles, comme 10 fois le diviseur, plus le reste.';
    case 'pct':
      if (/TVA/.test(t)) return 'TVA à 20 % = un cinquième du prix HT : divise par 10, puis multiplie par 2. Prix TTC = HT × 1,2.';
      return '10 % = diviser par 10 ; 1 % = diviser par 100 ; 5 % = la moitié de 10 % ; 25 % = un quart. Astuce : x % de y = y % de x (8 % de 50 = 50 % de 8 = 4).';
    case 'pow':
      if (/³/.test(t)) return 'Un cube, c’est le carré multiplié encore une fois par le nombre : n³ = n² × n.';
      if (/5²$/.test(t)) return 'Un nombre qui finit par 5 : multiplie les dizaines par le nombre suivant, puis colle 25. 35² : 3 × 4 = 12, donc 1 225.';
      return 'Ramène-toi à une dizaine : n² = (n − d)(n + d) + d². Pour 47² : 44 × 50 + 9 = 2 209.';
    case 'evol': return 'Les évolutions successives se multiplient, elles ne s’additionnent pas : +20 % puis −20 % = × 1,2 × 0,8 = × 0,96, soit −4 %.';
    case 'r3': return /ouvriers/.test(t) ? 'Inversement proportionnel : plus d’ouvriers, moins de jours. Le produit ouvriers × jours reste constant.' : 'Proportionnalité : calcule la valeur pour 1, puis multiplie par la quantité demandée.';
    case 'suite': return 'Regarde les écarts entre deux termes : constants (+ r), multipliés (× r), qui alternent (+a, −b), ou bien des carrés (1, 4, 9, 16…).';
    case 'frac': return '« Les a/b de » veut dire « multiplier par a/b ». Multiplie les fractions entre elles, simplifie, puis applique au nombre.';
    case 'vit': return 'Convertis en heures décimales : 15 min = 0,25 h ; 20 min ≈ 0,33 h ; 30 min = 0,5 h ; 45 min = 0,75 h. Puis vitesse = distance ÷ temps.';
    case 'inter': return 'Intérêts composés : capital × (1 + taux)^années. Les intérêts de la 1re année rapportent eux aussi des intérêts.';
    case 'moy': return 'Somme totale = moyenne × nombre de valeurs. La valeur manquante = somme totale − valeurs connues.';
    case 'part': return 'x % de N : découpe x en dizaines et unités de pourcent. 10 % = N ÷ 10, 1 % = N ÷ 100.';
  }
  return 'Décompose le calcul en étapes simples que tu sais faire de tête.';
}
